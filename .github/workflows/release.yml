name: release

# Push a tag that matches the version in Cargo.toml, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cargo reads CARGO_REGISTRY_TOKEN from the environment, so the token
      # never appears on the command line.
      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          if [ -f peek.exe ]; then bin=peek.exe; else bin=peek; fi
          tar -czf "$GITHUB_WORKSPACE/peek-${{ matrix.target }}.tar.gz" "$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: peek-${{ matrix.target }}
          path: peek-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github-release:
    name: github release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
