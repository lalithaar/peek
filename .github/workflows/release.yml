name: release

# Push a tag that matches the version in Cargo.toml, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cargo reads CARGO_REGISTRY_TOKEN from the environment, so the token
      # never appears on the command line. Publishing is skipped when the
      # version is already on crates.io, so re-running a tag is safe.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -fsS -H 'User-Agent: peek-release' \
              "https://crates.io/api/v1/crates/peek-editor/$version" >/dev/null; then
            echo "peek-editor $version is already on crates.io; nothing to publish"
          else
            cargo publish
          fi

  binaries:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      # Keep the archive path relative: GNU tar on Git Bash mistakes a
      # `D:\...` destination for a remote host ("Cannot connect to D:").
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          out="peek-${{ matrix.target }}.tar.gz"
          dir="target/${{ matrix.target }}/release"
          if [ -f "$dir/peek.exe" ]; then bin=peek.exe; else bin=peek; fi
          tar -czf "$out" -C "$dir" "$bin"
          echo "created $out"

      - uses: actions/upload-artifact@v4
        with:
          name: peek-${{ matrix.target }}
          path: peek-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github-release:
    name: github release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
