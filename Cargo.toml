[package]
name = "peek-editor"
version = "0.1.2"
edition = "2024"
description = "Terminal based text-editor for 'I know roughly what I'm looking for, just take me there' - quickly find, edit, save and move on. 0 modes or tabs to learn."
license = "MIT"
repository = "https://github.com/lalithaar/peek"
readme = "README.md"
keywords = ["editor", "tui", "terminal", "fuzzy-search", "git"]
categories = ["command-line-utilities", "text-editors"]
# Repo-only tooling, not part of the published crate. The screenshots stay in
# because the README links to them.
exclude = [".github/", "install-path.ps1"]

# `peek` is taken on crates.io, so the crate is peek-editor. What you install
# and run is still `peek`.
[[bin]]
name = "peek"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
nucleo-matcher = "0.3"
ignore = "0.4"
regex = "1"
# Pure-Rust regex engine: no C toolchain, no onig build.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
