[package]
name = "peek"
version = "0.1.0"
edition = "2024"
description = "A terminal editor where you type a pattern, not a path"

[[bin]]
name = "peek"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
nucleo-matcher = "0.3"
ignore = "0.4"
regex = "1"
# Pure-Rust regex engine: no C toolchain, no onig build.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
